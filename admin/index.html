<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pannello di Gestione | Laura Ogliastro</title>
  <link rel="icon" href="../images/salone-interno.png" type="image/png" />
  <!-- Script Netlify Identity per autenticazione sicura -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Decap CMS Core -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Registra lo stile per limitare la dimensione delle immagini nell'anteprima
    if (window.CMS) {
      CMS.registerPreviewStyle("admin.css");
    }

    // Reindirizza l'utente alla home una volta effettuato il logout o se aperto da invite email
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.reload();
          });
        }
      });
    }
  </script>
</body>
</html>
